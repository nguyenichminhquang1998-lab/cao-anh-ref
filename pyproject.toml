[project]
name = "cao-anh-ref"
version = "0.1.0"
description = "MCP tool tim & tai anh reference cho moodboard/shotlist"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "playwright>=1.45",
    "pillow>=10.0",
    "colorthief>=0.2.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cao_anh_ref"]

[project.scripts]
cao-anh-ref = "cao_anh_ref.server:main"
